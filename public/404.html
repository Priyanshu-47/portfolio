<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      /* GitHub Pages SPA deep-link fix (rafgraph/spa-github-pages pattern).
         GH Pages has no server fallback: a direct visit / refresh of a client
         route like /portfolio/about 404s because no such file exists. GH serves
         this 404.html instead; we rewrite the URL to /portfolio/?/about so the
         real index.html loads, then the restore at the top of src/main.tsx
         turns ?/about back into /about before React Router boots.
         /portfolio is the deployed subpath -> keep 1 path segment. */
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
